[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker: consumes jobs from the application's queues.
; Application uses 4 named queues: monitors, notifications, warming, lighthouse.
; This worker handles the first 3 (highest priority); lighthouse has its own worker (resource-heavy).
; Order matters: monitors first (every minute), then notifications, then warming.
; Default queue listed last as fallback for any non-categorized job.
[program:queue-worker]
command=php /var/www/html/artisan queue:work redis --queue=monitors,notifications,warming,default --sleep=3 --tries=3 --max-time=3600 --max-jobs=500
autostart=true
autorestart=true
priority=20
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Lighthouse queue worker: separate process for the resource-heavy lighthouse runs
[program:lighthouse-worker]
command=php /var/www/html/artisan queue:work redis --queue=lighthouse --sleep=5 --tries=3 --max-time=3600 --max-jobs=100
autostart=true
autorestart=true
priority=21
numprocs=1
stopwaitsecs=3600
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Reverb WebSocket server: nginx proxies /app (websocket handshake) and /apps (broadcast
; HTTP API) to 127.0.0.1:8080 — see docker/nginx/default.conf. Production (Dokploy,
; buildType=dockerfile) runs this image as a SINGLE container, so the dedicated "reverb"
; service in docker-compose.yml never runs there. Without this program nothing listens
; on 8080 and every wss:// handshake dies with a 502.
; Bound to 127.0.0.1 on purpose: only the in-container nginx talks to it, and it avoids
; confusion with the dedicated reverb container in docker-compose deployments.
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8080
autostart=true
autorestart=true
priority=25
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Scheduler (Laravel 11+ schedule:work): replaces the legacy cron + schedule:run pattern.
; Stays alive in foreground, invokes due jobs once per minute internally.
; Without this process, NO scheduled job runs — including DispatchChecks (the heart of monitoring).
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
priority=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
